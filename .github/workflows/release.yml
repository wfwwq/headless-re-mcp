# Build, verify and publish the per-user MSI.
#
# workflow_dispatch builds and verifies without publishing, so the packaging
# path can be exercised without cutting a release. Pushing a v* tag additionally
# uploads the installer and its checksum to a GitHub Release.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  msi:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[web]"

      - name: Build SPA
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Ensure WiX 3.14
        run: |
          $bin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path -LiteralPath $bin)) {
            choco install wixtoolset --no-progress -y
          }
          if (-not (Test-Path -LiteralPath $bin)) { throw "WiX 3.14 toolset unavailable on this runner" }
          "WIXBIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build MSI
        run: .\scripts\build_msi.ps1 -WixDir "$env:WIXBIN"

      - name: Verify MSI round-trip
        run: .\scripts\verify_msi.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: headless-re-mcp-msi
          path: |
            artifacts/release/headless-re-mcp.msi
            artifacts/release/headless-re-mcp.msi.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-pushing a tag must not turn CI red, and `gh release create`
          # refuses outright once a release for that tag exists, so publishing
          # has to be idempotent: create the release when it is missing,
          # otherwise replace the installer and checksum on the published one.
          $tag = "$env:GITHUB_REF_NAME"
          $repo = "$env:GITHUB_REPOSITORY"

          # A missing release and a repository this token cannot read both
          # answer 404, so the tag probe alone cannot tell "nothing published
          # yet" from "no access". Confirm the repository is readable first;
          # only then does a 404 on the tag mean "go create it".
          #
          # The probes are expected to fail, and the runner sets
          # $ErrorActionPreference = 'Stop', under which stderr from a native
          # command can become a terminating error before the exit code is
          # read. They run with that relaxed for the duration of the probe.
          $previous = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          try {
            gh api "repos/$repo" --silent 2>$null
            $repoReadable = $LASTEXITCODE -eq 0
            gh api "repos/$repo/releases/tags/$tag" --silent 2>$null
            $releaseExists = $LASTEXITCODE -eq 0
          } finally {
            $ErrorActionPreference = $previous
          }

          if (-not $repoReadable) { throw "cannot read $repo with this token" }

          if ($releaseExists) {
            # Idempotent path: the release is already published, so replace
            # its assets rather than failing on the duplicate.
            gh release upload $tag `
              artifacts/release/headless-re-mcp.msi `
              artifacts/release/headless-re-mcp.msi.sha256 `
              --clobber `
              --repo $repo
          } else {
            # `create` attaches to the tag that is already there; it only
            # objects to a duplicate release.
            gh release create $tag `
              artifacts/release/headless-re-mcp.msi `
              artifacts/release/headless-re-mcp.msi.sha256 `
              --title $tag `
              --generate-notes `
              --repo $repo
          }

          if ($LASTEXITCODE -ne 0) { throw "publishing release $tag failed (exit $LASTEXITCODE)" }
